<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Softmax 逐 block 演示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #1e1e2e; --fg: #cdd6f4; --muted: #6c7086; --dim: #7f849c;
    --surface: #181825; --border: #45475a; --overlay: #313244;
    --green: #a6e3a1; --red: #f38ba8; --blue: #89b4fa; --yellow: #f9e2af;
    --mauve: #cba6f7; --peach: #fab387; --teal: #94e2d5;
    --green-bg: rgba(166,227,161,0.15); --blue-bg: rgba(137,180,250,0.15);
    --mauve-bg: rgba(203,166,247,0.15); --peach-bg: rgba(250,179,135,0.15);
    --yellow-bg: rgba(249,226,175,0.12);
  }
  .light {
    --bg: #eff1f5; --fg: #4c4f69; --muted: #8c8fa1; --dim: #7c7f93;
    --surface: #e6e9ef; --border: #ccd0da; --overlay: #dce0e8;
    --green: #40a02b; --red: #d20f39; --blue: #1e66f5; --yellow: #df8e1d;
    --mauve: #8839ef; --peach: #fe640b; --teal: #179299;
    --green-bg: rgba(64,160,43,0.12); --blue-bg: rgba(30,102,245,0.12);
    --mauve-bg: rgba(136,57,239,0.12); --peach-bg: rgba(254,100,11,0.12);
    --yellow-bg: rgba(223,142,29,0.12);
  }
  body {
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    background: var(--bg); color: var(--fg); padding: 20px;
    transition: background 0.3s, color 0.3s;
  }
  .container { max-width: 820px; margin: 0 auto; }
  .intro { font-size: 12.5px; line-height: 1.7; color: var(--dim); margin-bottom: 16px; }
  .controls { display: flex; gap: 10px; justify-content: center; margin-bottom: 18px; flex-wrap: wrap; }
  .btn {
    padding: 9px 22px; border: 2px solid var(--blue); border-radius: 8px;
    background: var(--blue-bg); color: var(--blue); font-family: inherit;
    font-size: 13px; cursor: pointer; transition: all 0.2s; font-weight: bold;
  }
  .btn:hover { filter: brightness(1.15); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn.secondary { border-color: var(--border); background: transparent; color: var(--muted); font-weight: normal; }

  .seq { margin-bottom: 18px; }
  .seq-label { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
  .keys { display: flex; gap: 6px; }
  .key-cell {
    flex: 1; border: 1.5px solid var(--border); border-radius: 6px;
    padding: 8px 4px; text-align: center; background: var(--surface);
    transition: all 0.25s; position: relative;
  }
  .key-cell.done { border-color: var(--mauve); background: var(--mauve-bg); }
  .key-cell.active { border-color: var(--peach); background: var(--peach-bg); box-shadow: 0 0 0 2px var(--peach-bg); }
  .key-idx { font-size: 10px; color: var(--muted); }
  .key-s { font-size: 14px; font-weight: bold; color: var(--fg); }
  .key-v { font-size: 10px; color: var(--dim); margin-top: 2px; }
  .block-bracket { display: flex; gap: 6px; margin-top: 4px; }
  .bracket { flex: 1; text-align: center; font-size: 10px; color: var(--muted); }
  .bracket.active { color: var(--peach); font-weight: bold; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
  @media (max-width: 620px) { .grid2 { grid-template-columns: 1fr; } }
  .panel {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px;
  }
  .panel-title { font-size: 12px; color: var(--muted); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.04em; }
  .row { display: flex; justify-content: space-between; align-items: baseline; padding: 4px 0; font-size: 13px; }
  .row .k { color: var(--dim); }
  .row .val { font-weight: bold; }
  .val.green { color: var(--green); } .val.blue { color: var(--blue); }
  .val.mauve { color: var(--mauve); } .val.peach { color: var(--peach); }
  .val.yellow { color: var(--yellow); } .val.teal { color: var(--teal); }
  .formula { font-size: 11.5px; color: var(--dim); line-height: 1.7; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border); }
  .formula code { color: var(--fg); }

  .result {
    margin-top: 4px; padding: 14px 16px; border-radius: 10px;
    border: 1px solid var(--green); background: var(--green-bg);
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
  }
  .result .big { font-size: 22px; font-weight: bold; color: var(--green); }
  .result .ref { font-size: 12px; color: var(--dim); }
  .match { font-size: 12px; padding: 3px 10px; border-radius: 20px; }
  .match.ok { background: var(--green-bg); color: var(--green); border: 1px solid var(--green); }
  .step-tag { text-align: center; font-size: 12px; color: var(--muted); margin-bottom: 12px; }
</style>
</head>
<body>
<div class="container">
  <div class="intro" id="intro"></div>
  <div class="step-tag" id="step-tag"></div>

  <div class="seq">
    <div class="seq-label" id="seq-label"></div>
    <div class="keys" id="keys"></div>
    <div class="block-bracket" id="brackets"></div>
  </div>

  <div class="controls">
    <button class="btn" id="btn-next" onclick="next()"></button>
    <button class="btn secondary" id="btn-reset" onclick="reset()"></button>
  </div>

  <div class="grid2">
    <div class="panel" id="panel-block"></div>
    <div class="panel" id="panel-state"></div>
  </div>

  <div class="result" id="result"></div>
</div>

<script>
// ── i18n ───────────────────────────────────────────────────────────
function getLang() {
  try {
    const lang = window.parent.document.documentElement.lang || 'zh';
    return lang.startsWith('zh') ? 'zh' : 'en';
  } catch (e) { return 'zh'; }
}
const T = {
  zh: {
    intro: '一个 query 向量 q 要和 6 个 key 做 attention。这 6 个 key/value 被切成 3 个 block（每块 2 个），逐块流式处理。下方每个格子是一个 key：上方是分数 s = q·kⱼ，下方是对应的 value（为便于展示用标量，实际是向量）。点「下一个 Block」观察累计状态 m / l / z 的更新。',
    seqLabel: 'K / V 序列（6 个 token，切成 3 个 block）',
    next: '下一个 Block ▶', allDone: '✓ 全部处理完', reset: '重置',
    stepInit: '初始状态：m = −∞，l = 0，z = 0（还没处理任何 block）',
    stepN: (i) => `已处理 Block ${i} / 3`,
    blockTitle: '当前 Block 的局部计算',
    stateTitle: '累计状态（running state）',
    noBlock: '点「下一个 Block」开始处理第一个 block。',
    bScores: '本块分数 s', bValues: '本块 value', mBlock: 'm_block（本块最大）',
    mNew: 'm_new（新全局最大）', alpha: 'α = e^(m_old − m_new)',
    alphaNote: '历史整体缩放因子',
    mState: 'm（全局最大分数）', lState: 'l（累计分母）', zState: 'z（累计分子）',
    runO: '当前输出 O = z / l',
    blockFormula: 'l ← α·l + Σ e^(sⱼ−m_new)　　z ← α·z + Σ e^(sⱼ−m_new)·vⱼ',
    block: 'Block', keys: 'key',
    refLabel: '一次性算（标准 softmax）的标准答案',
    matchOk: '✓ 与标准答案完全相等',
    running: '处理中…', final: '最终输出',
  },
  en: {
    intro: 'One query vector q attends over 6 keys. The 6 key/value pairs are split into 3 blocks (2 each), processed in a stream. Each cell below is a key: top = score s = q·kⱼ, bottom = its value (shown as a scalar for clarity; really a vector). Click “Next Block” to watch the running state m / l / z update.',
    seqLabel: 'K / V sequence (6 tokens, split into 3 blocks)',
    next: 'Next Block ▶', allDone: '✓ All done', reset: 'Reset',
    stepInit: 'Initial: m = −∞, l = 0, z = 0 (no block processed yet)',
    stepN: (i) => `Processed Block ${i} / 3`,
    blockTitle: 'Current Block — local computation',
    stateTitle: 'Running state',
    noBlock: 'Click “Next Block” to process the first block.',
    bScores: 'block scores s', bValues: 'block values', mBlock: 'm_block (block max)',
    mNew: 'm_new (new global max)', alpha: 'α = e^(m_old − m_new)',
    alphaNote: 'rescale factor for history',
    mState: 'm (global max score)', lState: 'l (running denom.)', zState: 'z (running numer.)',
    runO: 'current output O = z / l',
    blockFormula: 'l ← α·l + Σ e^(sⱼ−m_new)   z ← α·z + Σ e^(sⱼ−m_new)·vⱼ',
    block: 'Block', keys: 'key',
    refLabel: 'reference answer (one-pass standard softmax)',
    matchOk: '✓ exactly equals the reference',
    running: 'running…', final: 'final output',
  }
};
const t = (k) => T[getLang()][k];

// ── data (one query row, 6 keys, 3 blocks of 2) ────────────────────
const scores = [1, 3, 2, 5, 4, 0.5];
const values = [10, 20, 30, 5, 15, 25];
const BLOCK = 2;
const nBlocks = scores.length / BLOCK;

// reference: standard one-pass softmax over the whole row
function reference() {
  const m = Math.max(...scores);
  let l = 0, z = 0;
  for (let j = 0; j < scores.length; j++) {
    const p = Math.exp(scores[j] - m);
    l += p; z += p * values[j];
  }
  return z / l;
}
const refO = reference();

// streaming state computed up to `step` blocks processed
function stateAt(step) {
  let m = -Infinity, l = 0, z = 0;
  let last = null;
  for (let b = 0; b < step; b++) {
    const start = b * BLOCK;
    const s = scores.slice(start, start + BLOCK);
    const v = values.slice(start, start + BLOCK);
    const mBlock = Math.max(...s);
    const mOld = m;
    const mNew = Math.max(mOld, mBlock);
    const alpha = mOld === -Infinity ? 0 : Math.exp(mOld - mNew);
    let lAdd = 0, zAdd = 0;
    for (let i = 0; i < s.length; i++) {
      const p = Math.exp(s[i] - mNew);
      lAdd += p; zAdd += p * v[i];
    }
    l = alpha * l + lAdd;
    z = alpha * z + zAdd;
    m = mNew;
    last = { s, v, mBlock, mOld, mNew, alpha, start };
  }
  return { m, l, z, O: l > 0 ? z / l : NaN, last };
}

let step = 0;  // number of blocks processed
const fmt = (x, d = 4) => (Number.isFinite(x) ? x.toFixed(d) : '−∞');

function next() { if (step < nBlocks) { step++; render(); } }
function reset() { step = 0; render(); }

function render() {
  document.getElementById('intro').textContent = t('intro');
  document.getElementById('seq-label').textContent = t('seqLabel');
  document.getElementById('btn-reset').textContent = t('reset');
  const btnNext = document.getElementById('btn-next');
  btnNext.textContent = step >= nBlocks ? t('allDone') : t('next');
  btnNext.disabled = step >= nBlocks;

  document.getElementById('step-tag').textContent =
    step === 0 ? t('stepInit') : t('stepN')(step);

  // key cells
  const keys = document.getElementById('keys');
  keys.innerHTML = '';
  for (let j = 0; j < scores.length; j++) {
    const b = Math.floor(j / BLOCK);
    let cls = 'key-cell';
    if (b < step) cls += ' done';
    else if (b === step && step < nBlocks) cls += ' active';
    const d = document.createElement('div');
    d.className = cls;
    d.innerHTML = `<div class="key-idx">${t('keys')} ${j + 1}</div>` +
      `<div class="key-s">s=${scores[j]}</div>` +
      `<div class="key-v">v=${values[j]}</div>`;
    keys.appendChild(d);
  }
  // brackets per block
  const brackets = document.getElementById('brackets');
  brackets.innerHTML = '';
  for (let b = 0; b < nBlocks; b++) {
    const d = document.createElement('div');
    d.className = 'bracket' + ((b === step && step < nBlocks) ? ' active' : '');
    d.style.flex = BLOCK;
    d.textContent = `└ ${t('block')} ${b + 1} ┘`;
    brackets.appendChild(d);
  }

  const st = stateAt(step);

  // block panel
  const pb = document.getElementById('panel-block');
  if (step === 0 || !st.last) {
    pb.innerHTML = `<div class="panel-title">${t('blockTitle')}</div>` +
      `<div class="row"><span class="k">${t('noBlock')}</span></div>`;
  } else {
    const L = st.last;
    pb.innerHTML = `<div class="panel-title">${t('blockTitle')} — ${t('block')} ${step}</div>` +
      row(t('bScores'), `[${L.s.join(', ')}]`, 'peach') +
      row(t('bValues'), `[${L.v.join(', ')}]`, 'peach') +
      row(t('mBlock'), fmt(L.mBlock, 1), 'yellow') +
      row(t('mNew'), fmt(L.mNew, 1), 'teal') +
      row(t('alpha') + ` <span style="color:var(--muted)">(${t('alphaNote')})</span>`, fmt(L.alpha), 'mauve') +
      `<div class="formula"><code>${t('blockFormula')}</code></div>`;
  }

  // state panel
  const ps = document.getElementById('panel-state');
  ps.innerHTML = `<div class="panel-title">${t('stateTitle')}</div>` +
    row(t('mState'), fmt(st.m, 1), 'teal') +
    row(t('lState'), fmt(st.l), 'blue') +
    row(t('zState'), fmt(st.z), 'mauve') +
    row(t('runO'), Number.isFinite(st.O) ? fmt(st.O) : '—', 'green');

  // result
  const done = step >= nBlocks;
  const res = document.getElementById('result');
  const oVal = Number.isFinite(st.O) ? fmt(st.O) : '—';
  res.innerHTML =
    `<div><div class="ref">${done ? t('final') : t('running')}　O = z / l</div>` +
    `<div class="big">${oVal}</div></div>` +
    `<div style="text-align:right"><div class="ref">${t('refLabel')}: <b>${fmt(refO)}</b></div>` +
    (done ? `<div class="match ok">${t('matchOk')}</div>` : '') + `</div>`;
}

function row(k, v, color) {
  return `<div class="row"><span class="k">${k}</span><span class="val ${color || ''}">${v}</span></div>`;
}

// ── theme sync (must run after all declarations) ───────────────────
function syncTheme() {
  try {
    const isDark = window.parent.document.documentElement.classList.contains('dark');
    document.body.classList.toggle('light', !isDark);
  } catch (e) {}
  render();
}
syncTheme();
try {
  new MutationObserver(syncTheme).observe(
    window.parent.document.documentElement, { attributes: true, attributeFilter: ['class'] }
  );
} catch (e) {}
</script>
</body>
</html>
